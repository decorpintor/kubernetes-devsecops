name: Kubernetes DevSecOps Pipeline

on:
  push:
    branches: [main]
    paths:
      - "k8s/**"
      - ".github/workflows/**"
  pull_request:
    branches: [main]
    paths:
      - "k8s/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-scan:
    name: Validate Kubernetes manifests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate YAML
        run: |
          python -m pip install --user yamllint
          yamllint -d relaxed k8s/

      - name: Scan Kubernetes configuration
        uses: aquasecurity/trivy-action@0.33.1
        with:
          scan-type: config
          scan-ref: k8s/
          severity: HIGH,CRITICAL
          exit-code: '1'
          format: table
